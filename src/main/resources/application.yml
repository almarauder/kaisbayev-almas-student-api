spring:
  application:
    name: kaisbayev-almas-student-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/studentdb}
    username: ${SPRING_DATASOURCE_USERNAME:student}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8080
